# No Production credentials, deploy steps, providers or persistent runners.
# Actions pinned to upstream SHA tags verified on 2026-10-20.
name: SCHMAQQ Studio R24 CI

on:
  pull_request:
    branches:
      - "codex/r24-*"
  push:
    branches:
      - "codex/r24f-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-r24-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-backend-and-release:
    name: Source, tests and isolated release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch unprivileged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select supported Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify candidate ancestry and source status
        run: node scripts/r24-candidate-gate.mjs

      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts --include=dev --include=optional --no-audit --no-fund

      - name: Source guard, backend tests, TypeScript and Vite
        run: node selfhost/verify.mjs

      - name: Create and verify isolated release, then smoke test
        run: node scripts/r24-ci-release-smoke.mjs

      - name: Keep review-only archive for seven days
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-r24-review-${{ github.sha }}
          path: .studio/releases/*.tar.gz
          retention-days: 7
          if-no-files-found: error
